<style>
:root{
  --bg:#00121C; --bg2:#0B3D3A; --bg3:#003441;
  --pri:#1CBB93; --acc:#3DDC97; --acc2:#1CDBCB;
  --ink:#EDF7F8; --mut:#8FB3B0; --red:#FF6B6B;
  --card:rgba(237,247,248,.08); --line:rgba(237,247,248,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:var(--ink);font-family:Alexandria,system-ui,sans-serif;font-weight:500;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* phone frame: full screen on phones, framed on desktop */
.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:radial-gradient(120% 80% at 70% 0%,var(--bg2) 0%,var(--bg) 55%,#000 100%)}
@media (min-width:600px){
  .phone{width:390px;height:min(844px,94vh);border-radius:54px;border:12px solid #111;
    box-shadow:0 0 0 2px #2a2a2a,0 40px 80px rgba(0,0,0,.6)}
  body{background:radial-gradient(circle at 50% 30%,#0B3D3A 0%,#000 70%)}
}
.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:14px;font-weight:700;z-index:50;direction:ltr}
.status .bat{display:flex;gap:6px;align-items:center}
.batbox{width:26px;height:12px;border:1.5px solid var(--ink);border-radius:4px;padding:1px;position:relative}
.batbox i{display:block;height:100%;width:9%;background:var(--red);border-radius:2px}
.screen{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.hidden{opacity:0;pointer-events:none}

/* ---------- lock ---------- */
#lock{display:flex;flex-direction:column;align-items:center;padding:64px 14px 24px;z-index:20;
  background:radial-gradient(120% 70% at 50% 0%,#0B3D3A 0%,#00121C 60%,#000 100%)}
#lock.up{transform:translateY(-100%);opacity:0}
.lk-date{font-size:16px;color:var(--mut);margin-top:6px}
.lk-time{font-size:84px;font-weight:800;line-height:1;letter-spacing:-2px;direction:ltr}
.lost{margin:14px 0 6px;text-align:center}
.lost b{display:block;font-size:20px;font-weight:900;color:var(--acc)}
.lost span{font-size:13px;color:var(--mut)}
.notifs{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:14px;overflow:hidden}
.nt{background:rgba(237,247,248,.1);backdrop-filter:blur(14px);border-radius:20px;padding:11px 13px;
  display:flex;gap:10px;align-items:flex-start;animation:pop .5s both}
.nt .ic{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:20px}
.nt .tx{flex:1;min-width:0}
.nt .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.nt .hd b{color:var(--ink);font-weight:700}
.nt p{font-size:13.5px;line-height:1.5;margin-top:2px}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.97)}}
.swipe{margin-top:auto;font-size:14px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}
.swipe .bar{width:134px;height:5px;border-radius:9px;background:var(--ink)}
.swipe span{animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-5px);opacity:.6}}

/* ---------- home ---------- */
#home{padding:70px 22px 30px;display:flex;flex-direction:column}
.widget{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:22px}
.widget small{color:var(--acc);font-weight:700;font-size:12px}
.widget p{font-size:14px;margin-top:4px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;position:relative}
.app .ic{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:30px;
  box-shadow:0 6px 16px rgba(0,0,0,.35)}
.app:active .ic{transform:scale(.92)}
.badge{position:absolute;top:-6px;left:4px;background:var(--red);color:#fff;font-size:12px;font-weight:800;
  min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.dock{margin-top:auto;background:rgba(237,247,248,.1);border-radius:30px;padding:14px;display:flex;justify-content:space-around}
.g1{background:linear-gradient(160deg,#3DDC97,#13906f)}
.g2{background:linear-gradient(160deg,#ffd76a,#f0a92b)}
.g3{background:linear-gradient(160deg,#ffffff,#d9e6e5)}
.g4{background:linear-gradient(160deg,#5ab8ff,#1d6fd8)}
.g5{background:linear-gradient(160deg,#ff8a8a,#e04848)}
.g6{background:linear-gradient(160deg,#9aa6ad,#56646b)}
.g7{background:linear-gradient(160deg,#1CDBCB,#0a7f86)}
.g8{background:linear-gradient(160deg,#2b2f33,#111)}

/* ---------- app window ---------- */
.win{background:var(--bg);display:flex;flex-direction:column;transform:translateX(-100%);z-index:30}
.win.open{transform:none}
.wh{padding:52px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:rgba(0,18,28,.92)}
.wh .back{color:var(--acc);font-size:15px;font-weight:700;padding:6px 4px}
.wh h2{flex:1;text-align:center;font-size:17px;font-weight:800;margin-left:52px}
.wb{flex:1;overflow-y:auto;padding:12px 14px 30px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:var(--bg3)}
.row .tx{flex:1;min-width:0}
.row .t1{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.row .t1 small{color:var(--mut);font-weight:500;font-size:12px}
.row .t2{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.unread{background:var(--pri);color:#00121C;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

/* chat */
.chat{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.daytag{align-self:center;font-size:11px;color:var(--mut);background:var(--card);padding:4px 10px;border-radius:9px;margin:6px 0}
.msg{max-width:82%;padding:8px 11px 6px;border-radius:14px;font-size:14px;line-height:1.6;background:#12313a;align-self:flex-end;border-top-left-radius:4px}
.msg.me{align-self:flex-start;background:#0f6b55;border-top-left-radius:14px;border-top-right-radius:4px}
.msg .who{font-size:12px;font-weight:800;display:block;margin-bottom:1px}
.msg time{display:block;font-size:10.5px;color:rgba(237,247,248,.55);text-align:left;margin-top:2px}

/* notes */
.note h3{font-size:22px;font-weight:900;margin:6px 0 4px}
.note .meta{color:var(--mut);font-size:12px;margin-bottom:12px}
.note p,.note li{font-size:15px;line-height:1.9}
.note ul{list-style:none}
.note li::before{content:"☐ ";color:var(--acc)}
.note li.d::before{content:"☑ "}
.note li.d{color:var(--mut);text-decoration:line-through}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ph{aspect-ratio:1;background:#fff center/contain no-repeat;border-radius:4px;overflow:hidden;position:relative}
.ph.txt{background:linear-gradient(160deg,#ffe27a,#f6c445);color:#3a2d00;display:grid;place-items:center;
  font-weight:800;font-size:13px;text-align:center;padding:8px;line-height:1.5;transform:rotate(-2deg)}
.viewer{position:absolute;inset:0;background:rgba(0,0,0,.94);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.viewer img{max-width:88%;max-height:60%;background:#fff;border-radius:12px;padding:10px}
.viewer p{margin-top:16px;text-align:center;font-size:15px;line-height:1.7}

/* files */
.folder{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:right}
.folder .fi{font-size:34px}
.folder b{display:block;font-size:15px}
.folder small{color:var(--mut);font-size:12px}
.folder.secret{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}

/* keypad */
.kp{position:absolute;inset:0;z-index:70;background:rgba(0,18,28,.97);display:flex;flex-direction:column;align-items:center;padding:70px 24px 30px}
.kp h3{font-size:18px;font-weight:800;margin-top:8px;text-align:center}
.kp .sub{color:var(--mut);font-size:13px;margin-top:6px;text-align:center;min-height:40px;line-height:1.6}
.dots{display:flex;gap:16px;margin:20px 0 26px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:16px 24px;direction:ltr}
.keys button{width:74px;height:74px;border-radius:50%;background:rgba(237,247,248,.12);font-size:28px;font-weight:700}
.keys button:active{background:rgba(237,247,248,.3)}
.keys .empty{visibility:hidden}
.kp .cancel{margin-top:auto;color:var(--acc);font-weight:700;padding:10px}

/* deals */
.reveal{text-align:center;padding:8px 4px 14px}
.reveal .tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px}
.reveal h3{font-size:24px;font-weight:900;margin:10px 0 4px;line-height:1.4}
.reveal p{color:var(--mut);font-size:13px;line-height:1.7}
.timer{margin:10px auto 0;display:inline-flex;gap:6px;direction:ltr;font-weight:800;font-size:15px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:12px}
.timer span{color:var(--acc)}
.deal{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;align-items:center;animation:pop .5s both}
.deal .img{width:86px;height:86px;flex:none;border-radius:12px;background:#fff center/contain no-repeat}
.deal .tx{flex:1;min-width:0}
.deal b{display:block;font-size:14px;line-height:1.5}
.deal .why{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.5}
.deal .pr{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.deal .price{font-size:18px;font-weight:800;color:var(--acc)}
.deal .off{background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:7px}
.deal a.go{display:inline-block;margin-top:8px;background:var(--pri);color:#00121C;font-weight:800;font-size:13px;padding:7px 14px;border-radius:10px;text-decoration:none}
.cta{display:block;text-align:center;background:linear-gradient(160deg,#1CDBCB,#1CBB93);color:#00121C;font-weight:900;font-size:16px;
  padding:14px;border-radius:16px;text-decoration:none;margin:14px 0 8px}
.share{display:block;width:100%;text-align:center;border:1.5px solid var(--acc);color:var(--acc);font-weight:800;font-size:15px;padding:12px;border-radius:16px}
.fine{color:var(--mut);font-size:11px;line-height:1.7;text-align:center;margin-top:14px}

/* settings / calendar */
.set{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.set div{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px;gap:10px}
.set div:last-child{border:0}
.set div span{color:var(--mut);text-align:left}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 14px 14px}
.meter i{display:block;height:100%;width:99.5%;background:linear-gradient(90deg,var(--acc),var(--red))}
.ev{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card);margin-bottom:8px}
.ev .d{width:52px;text-align:center;flex:none}
.ev .d b{display:block;font-size:24px;font-weight:900}
.ev .d small{color:var(--red);font-size:11px;font-weight:700}
.ev p{font-size:14px;line-height:1.6}
.ev p small{color:var(--mut);display:block}

.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(237,247,248,.95);color:#00121C;
  font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;z-index:90;width:max-content;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>

<script>
/* ====== DATA (prices from amazon.sa, checked 17 Nov 2026) ====== */
const TAG='ksa028-21';

const DEALS=[

  $('#lkDate').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]}

let y0=null;

lock.addEventListener('touchend',e=>{if(y0!==null&&y0-e.changedTouches[0].clientY>40)unlock();y0=null});

let found=false, tries=0;

 group:{name:'صيادين العروض 🎯',av:'🎯',last:'نوره: الرمز مو صعب 😂',time:'9:12 ص',un:7,msgs:[

function keypad(){let v='';const k=document.createElement('div');k.className='kp';
  k.innerHTML=`<div style="font-size:40px">🔒</div><h3>سري للغاية: أقوى عروض الجمعة</h3><div class="sub" id="ksub">أدخل الرمز</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button>${n}</button>`).join('')}<button class="empty"></button><button>0</button><button id="del" style="font-size:20px">⌫</button></div>
  <button class="cancel">إلغاء</button>`;
  $('#phone').appendChild(k);
  const dots=k.querySelectorAll('.dots i'),sub=k.querySelector('#ksub');
  const draw=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
  k.querySelector('.cancel').onclick=()=>k.remove();
  k.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{
    if(b.id==='del'){v=v.slice(0,-1);draw();return}
    if(v.length>=4)return; v+=b.textContent; draw();
    if(v.length===4)setTimeout(()=>{
      if(v===CODE){found=true;k.remove();deals();}
      else{tries++;const d=k.querySelector('.dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
        sub.innerHTML=tries>=3?'تلميح: شيك الملاحظات والتقويم 📅':tries>=2?'غلط… نوره قالت إنه مكتوب بالملاحظات 👀':'رمز غلط ❌';v='';draw()}
    },180)})}

  clearInterval(tick);const tm=$('#tm');
  const upd=()=>{const s=Math.max(0,(new Date(DEALS_END)-Date.now())/1000);

    const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
    tm.innerHTML=`ينتهي بعد <span>${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}</span>`};
  upd();tick=setInterval(upd,1000)}
async function share(){const data={title:'جوال صديق التوفير',text:'لقيت جوال صديق التوفير ضايع 😳 فيه ملف سري بأقوى عروض الجمعة… تقدر تفتحه؟',url:location.href.split('#')[0]};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){return}
  try{await navigator.clipboard.writeText(data.text+' '+data.url);toast('انسخ الرابط ✅ أرسله لخويك')}catch(e){toast(data.url)}}
